name = "beacon-license"
main = "src/index.js"
compatibility_date = "2026-07-01"
account_id = "305ab75281717568c5612a2abcbc696e"

routes = [
  { pattern = "license.beaconmac.com", custom_domain = true }
]

# Public identifiers only (no secrets). STRIPE_PRICE_ID scopes license minting
# to Beacon's own recurring price, so a paid Stripe session for anything else
# can't mint a Beacon key. Copy it from the Stripe dashboard (Product → Pricing,
# the price row's "price_..." id). The secret key is NOT here — set it with:
#   cd licensing && npx wrangler secret put STRIPE_SECRET_KEY
[vars]
STRIPE_PRICE_ID = "REPLACE_WITH_price_id"

[[kv_namespaces]]
binding = "LICENSES"
id = "51e09be30ab146dd9bb1fc033dae83ea"
